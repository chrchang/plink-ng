[workspace]
name = "plink2"
version = "2.0.0"
description = "PLINK 2.0 build environment"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
c-compiler = "*"
cxx-compiler = "*"
make = "*"
zlib = "*"
zstd = "*"
gmp = "*"
aws-sdk-cpp = "*"

[target.linux-64.dependencies]
openblas = "*"
liblapack = "*"
liblapacke = "*"

[tasks]
build = { cmd = "make USE_S3=1 -j$(nproc 2>/dev/null || sysctl -n hw.ncpu) plink2", cwd = "build_dynamic" }
clean = { cmd = "make clean", cwd = "build_dynamic" }

[activation]
scripts = ["pixi_activate.sh"]

[feature.r.dependencies]
r-base = "*"
r-rcpp = "*"
r-testthat = ">=3.3.1,<4"
r-devtools = ">=2.5.0,<3"

[environments]
r = ["r"]
