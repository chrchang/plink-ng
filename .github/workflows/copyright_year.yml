name: Update copyright year

# Bumps the end year in PLINK's own copyright lines on 1 January, and opens a
# pull request with the result.  Nothing is pushed to master directly.
#
# Note that GitHub disables scheduled workflows in a repository with no commit
# activity for 60 days, and only runs them from the default branch; the manual
# trigger below covers both of those cases.

on:
  schedule:
    - cron: '0 6 1 1 *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.repository == 'chrchang/plink-ng'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the end year
        id: rewrite
        run: |
          set -euo pipefail
          year=$(date -u +%Y)
          echo "year=$year" >> "$GITHUB_OUTPUT"

          python3 .github/scripts/bump_copyright_year.py "$year"

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Copyright years are already at ${year}."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Safety net: every added line must be one of the two intended forms.
          # This job runs unattended, so a stray match would otherwise reach a
          # pull request unreviewed.
          if git diff -U0 | grep -E '^\+' | grep -v '^+++' \
               | grep -vE 'part of (the )?PLINK[^,]*, copyright \(C\) [0-9]{4}-[0-9]{4}' \
               | grep -vE '\(C\) [0-9]{4}-[0-9]{4}.*GNU General Public License v3' \
               | grep -q .; then
            echo "Refusing to continue: the rewrite changed a line it was not meant to." >&2
            git --no-pager diff
            exit 1
          fi

          echo "file_ct=$(git diff --name-only | wc -l)" >> "$GITHUB_OUTPUT"
          git --no-pager diff --stat | tail -1

      - name: Open a pull request
        if: steps.rewrite.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ steps.rewrite.outputs.year }}
          FILE_CT: ${{ steps.rewrite.outputs.file_ct }}
        run: |
          set -euo pipefail
          branch="chore/copyright-${YEAR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          {
            printf 'Update copyright end year to %s\n\n' "${YEAR}"
            printf 'Generated by the copyright_year workflow.  Only lines identifying a\n'
            printf "file as PLINK's own were rewritten; the bundled third-party sources\n"
            printf 'and the LICENSE files are left alone.\n'
          } > /tmp/commit_msg
          git commit -aq -F /tmp/commit_msg
          git push -q -u origin "$branch" --force-with-lease

          {
            printf "Automated bump of the end year in PLINK's own copyright lines, across %s files.\n\n" "${FILE_CT}"
            printf 'Only lines matching `part of [the] PLINK..., copyright (C) YYYY-YYYY`, plus the two runtime banners, are rewritten. The bundled third-party sources (htslib, zstd, libdeflate, SFMT, QD) name their own authors and so cannot match, and the LICENSE files carry the GPL own date rather than a copyright year. The job fails rather than committing if any other line changes.\n\n'
            printf 'Comment-only, so no behaviour changes.\n'
          } > /tmp/pr_body
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "Update copyright end year to ${YEAR}" \
            --body-file /tmp/pr_body \
            || echo "A pull request for $branch already exists."
