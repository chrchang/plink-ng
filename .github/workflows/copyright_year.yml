name: Update copyright year

# Bumps the end year in PLINK's own copyright lines, and opens a pull request
# with the result.  Nothing is pushed to master directly.
#
# 1.9 and 2.0 are handled independently: each is bumped only once that tree has
# actually been touched in the current year, and each gets its own pull
# request.  A year in which only 2.0 changes therefore leaves 1.9's copyright
# lines alone, which is what the years mean.
#
# The schedule is weekly rather than on 1 January, since the bump should follow
# the year's first change to a tree rather than the calendar.  GitHub disables
# scheduled workflows in a repository with no commit activity for 60 days, and
# only runs them from the default branch; the manual trigger covers both.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.repository == 'chrchang/plink-ng'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ['1.9', '2.0']
    steps:
      - uses: actions/checkout@v4
        with:
          # git log --since needs history, not just the tip commit.
          fetch-depth: 0

      - name: Rewrite the end year
        id: rewrite
        env:
          DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          year=$(date -u +%Y)
          echo "year=$year" >> "$GITHUB_OUTPUT"

          # Only bump a tree that has been touched this year.  Without this, a
          # year in which only one of the two changes would still relabel both.
          if [ -z "$(git log --since="${year}-01-01T00:00:00Z" --format=%H -1 -- "$DIR")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No commits under ${DIR}/ in ${year}; leaving its copyright lines alone."
            exit 0
          fi

          python3 .github/scripts/bump_copyright_year.py "$year" "$DIR"

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${DIR}/ copyright years are already at ${year}."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Safety net: every added line must be one of the two intended forms.
          # This job runs unattended, so a stray match would otherwise reach a
          # pull request unreviewed.
          if git diff -U0 | grep -E '^\+' | grep -v '^+++' \
               | grep -vE 'part of (the )?PLINK[^,]*, copyright \(C\) [0-9]{4}-[0-9]{4}' \
               | grep -vE '\(C\) [0-9]{4}-[0-9]{4}.*GNU General Public License v3' \
               | grep -q .; then
            echo "Refusing to continue: the rewrite changed a line it was not meant to." >&2
            git --no-pager diff
            exit 1
          fi

          # And nothing outside the tree this job is responsible for.
          if git diff --name-only | grep -vE "^${DIR}/" | grep -q .; then
            echo "Refusing to continue: the rewrite touched files outside ${DIR}/." >&2
            git --no-pager diff --name-only
            exit 1
          fi

          echo "file_ct=$(git diff --name-only | wc -l)" >> "$GITHUB_OUTPUT"
          git --no-pager diff --stat | tail -1

      - name: Open a pull request
        if: steps.rewrite.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ steps.rewrite.outputs.year }}
          FILE_CT: ${{ steps.rewrite.outputs.file_ct }}
          DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          branch="chore/copyright-${DIR}-${YEAR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          {
            printf '%s: update copyright end year to %s\n\n' "${DIR}" "${YEAR}"
            printf 'Generated by the copyright_year workflow.  Only lines identifying a\n'
            printf "file as PLINK's own were rewritten; the bundled third-party sources\n"
            printf 'and the LICENSE files are left alone.\n'
          } > /tmp/commit_msg
          git commit -aq -F /tmp/commit_msg
          git push -q -u origin "$branch" --force-with-lease

          {
            printf "Automated bump of the end year in PLINK's own copyright lines under \`%s/\`, across %s files.\n\n" "${DIR}" "${FILE_CT}"
            printf 'Raised only because `%s/` has a commit in %s. The other tree is handled by its own run of this workflow, so a year that touches one and not the other leaves the other alone.\n\n' "${DIR}" "${YEAR}"
            printf 'Only lines matching `part of [the] PLINK..., copyright (C) YYYY-YYYY`, plus the two runtime banners, are rewritten. The bundled third-party sources (htslib, zstd, libdeflate, SFMT, QD) name their own authors and so cannot match, and the LICENSE files carry the GPL own date rather than a copyright year. The job fails rather than committing if any other line changes, or if anything outside `%s/` is touched.\n\n' "${DIR}"
            printf 'Comment-only, so no behaviour changes.\n'
          } > /tmp/pr_body
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "${DIR}: update copyright end year to ${YEAR}" \
            --body-file /tmp/pr_body \
            || echo "A pull request for $branch already exists."
