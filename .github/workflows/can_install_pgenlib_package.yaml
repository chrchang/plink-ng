# Checks if the pgenlib R package in this checkout can be installed and loaded.
#

on:
  push:
    paths:
      - 2.0/pgenlibr/**
      - .github/workflows/can_install_pgenlib_package.yaml
      - .github/scripts/apt-install.sh
  pull_request:

name: can_install_pgenlib_package

permissions:
  contents: read

jobs:
  can_install_pgenlib_package:

    runs-on: ubuntu-latest
    # Normally about 7 minutes.  This bounds a hang (e.g. setup-r stuck on
    # unreachable package mirrors) well below GitHub's 6-hour default.
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:

      # The runner image carries third-party apt sources that this job has no
      # use for.  setup-r runs apt-get update, which scans all of them, so an
      # inconsistent index on any one of them fails the job for reasons that
      # have nothing to do with plink-ng.  Dropping the Google Chrome source
      # is enough: it is the one that has broken here.
      - name: Drop apt sources this job does not need
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*google*.sources

      - uses: actions/checkout@v5

      # Install R
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      # Prequisite for using the 'remotes' R package
      # (apt-install.sh retries if the package mirrors are unreachable.)
      - name: Install libcurl4-openssl-dev
        run: .github/scripts/apt-install.sh libcurl4-openssl-dev

      - name: Install pgenlibr
        run: |
          install.packages("remotes")
          remotes::install_local("2.0/pgenlibr")
          library(pgenlibr)
        shell: Rscript {0}
