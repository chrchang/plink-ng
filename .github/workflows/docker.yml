name: Docker images

# Publishes ghcr.io/<owner>/plink2 for v2.* releases (v2.0.0-a.7.8, ...) and
# ghcr.io/<owner>/plink1 for v1.9.* releases (v1.9.0-rc3, v1.9.0, v1.9.1, ...),
# for linux/amd64 and linux/arm64 (each built on a native runner, then merged
# into one manifest).
#
# Image tags: the release version (e.g. 2.0.0-a.7.8), plus "latest" when the
# release is the newest of its line (for plink2, GitHub's "Latest" release, so
# a.5/a.6 releases published afterwards don't take it over).
#
# Pull requests that touch the Dockerfile build both images without pushing.
# Only GITHUB_TOKEN is needed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish, e.g. v2.0.0-a.7.8'
        required: true
  pull_request:
    branches:
      - master
    paths:
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      targets: ${{ steps.plan.outputs.targets }}
      version: ${{ steps.plan.outputs.version }}
      latest: ${{ steps.plan.outputs.latest }}
      push: ${{ steps.plan.outputs.push }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            {
              echo "ref=${{ github.sha }}"
              echo 'targets=["plink1","plink2"]'
              echo "version=pr-${{ github.event.pull_request.number }}"
              echo "latest=false"
              echo "push=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TAG" in
            v2.*) target=plink2 ;;
            v1.9.*) target=plink1 ;;
            *) echo "::error::Unrecognized release tag '$TAG'"; exit 1 ;;
          esac
          latest=false
          if [ "$target" = plink1 ]; then
            latest=true
          elif [ "$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)" = "$TAG" ]; then
            latest=true
          fi
          {
            echo "ref=$TAG"
            echo "targets=[\"$target\"]"
            echo "version=${TAG#v}"
            echo "latest=$latest"
            echo "push=true"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: needs.plan.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          load: ${{ needs.plan.outputs.push != 'true' }}
          tags: ${{ needs.plan.outputs.push != 'true' && format('{0}:test', matrix.target) || '' }}
          outputs: ${{ needs.plan.outputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) || '' }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform }}

      - name: Smoke test
        if: needs.plan.outputs.push != 'true'
        run: |
          bin=${{ matrix.target == 'plink1' && 'plink' || 'plink2' }}
          fmt=${{ matrix.target == 'plink1' && '--bfile' || '--pfile' }}
          docker run --rm ${{ matrix.target }}:test sh -c "cd /tmp && $bin --version && $bin --dummy 200 500 --out d > /dev/null && $bin $fmt d --maf 0.05 --freq --pca 2 --out o > /dev/null && test -s o.eigenvec"

      - name: Export digest
        if: needs.plan.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.push == 'true'
        with:
          name: digests-${{ matrix.target }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: [plan, build]
    if: needs.plan.outputs.push == 'true'
    strategy:
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.target }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.target }}
        run: |
          image="${IMAGE,,}"
          args=()
          while read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("$image@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$image:${{ needs.plan.outputs.version }}"
