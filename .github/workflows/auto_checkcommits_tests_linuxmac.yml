  # Step 2: Matrix job
  run_dynamicbuild_plink2tests:
    # needs: check_commits  # COMMENTED OUT - no longer conditional on commit check
    # if: needs.check_commits.outputs.new_commits == 'true'  # COMMENTED OUT - runs unconditionally
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Linux-specific dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libopenblas-dev \
            liblapack-dev \
            liblapacke-dev \
            zlib1g-dev \
            unzip \
            bc

      # Derived from the date, so a failed run or an evicted cache cannot skip a batch
      - name: Determine batch number
        id: batch
        run: |
          BATCH=$(( 10#$(date -u +%V) % 12 + 1 ))
          echo "batch_number=$BATCH" >> "$GITHUB_OUTPUT"
          echo "GLM_BATCH_NUM=$BATCH" >> "$GITHUB_ENV"
          echo "Running Batch $BATCH of 12"

      # Restore cached test data
      - name: Restore cached test data
        uses: actions/cache@v3
        id: test-data-cache
        with:
          path: test_data
          key: test-data-v1

      - name: Verify test data
        run: ls -l test_data

      - name: Run DYNAMICBUILD
        run: |
          chmod +x 2.0/build_dynamic/CI-SCRIPTS/DYNAMICBUILD_LINUXMAC_ROOT.sh
          2.0/build_dynamic/CI-SCRIPTS/DYNAMICBUILD_LINUXMAC_ROOT.sh

      - name: Run GLM TESTS (Batch ${{ steps.batch.outputs.batch_number }})
        run: |
          chmod +x 2.0/build_dynamic/CI-SCRIPTS/GLM_TESTS.sh
          2.0/build_dynamic/CI-SCRIPTS/GLM_TESTS.sh

      - name: Cleanup
        run: |
          chmod +x 2.0/build_dynamic/CI-SCRIPTS/CLEANUP.sh
          2.0/build_dynamic/CI-SCRIPTS/CLEANUP.sh
