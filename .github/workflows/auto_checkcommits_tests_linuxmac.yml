  # Step 2: Matrix job
  run_dynamicbuild_plink2tests:
    # needs: check_commits  # COMMENTED OUT - no longer conditional on commit check
    # if: needs.check_commits.outputs.new_commits == 'true'  # COMMENTED OUT - runs unconditionally
    runs-on: ${{ matrix.os }}
    # Normally about 5-10 minutes.  This bounds a hang (e.g. on unreachable
    # package mirrors) well below GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Linux-specific dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # apt-install.sh retries if the package mirrors are unreachable.
        run: |
          .github/scripts/apt-install.sh \
            build-essential \
            libopenblas-dev \
            liblapack-dev \
            liblapacke-dev \
            zlib1g-dev \
            unzip \
            bc

      # Derived from the date, so a failed run or an evicted cache cannot skip a batch
      - name: Determine batch number
        id: batch
        run: |
          BATCH=$(( 10#$(date -u +%V) % 12 + 1 ))
          echo "batch_number=$BATCH" >> "$GITHUB_OUTPUT"
          echo "GLM_BATCH_NUM=$BATCH" >> "$GITHUB_ENV"
          echo "Running Batch $BATCH of 12"

      # Restore cached test data
      - name: Restore cached test data
        uses: actions/cache@v3
        id: test-data-cache
        with:
          path: test_data
          key: test-data-v1

      - name: Verify test data
        run: ls -l test_data

      - name: Run DYNAMICBUILD
        id: build
        run: |
          chmod +x 2.0/build_dynamic/CI-SCRIPTS/DYNAMICBUILD_LINUXMAC_ROOT.sh
          2.0/build_dynamic/CI-SCRIPTS/DYNAMICBUILD_LINUXMAC_ROOT.sh

      - name: Run GLM TESTS (Batch ${{ steps.batch.outputs.batch_number }})
        run: |
          chmod +x 2.0/build_dynamic/CI-SCRIPTS/GLM_TESTS.sh
          2.0/build_dynamic/CI-SCRIPTS/GLM_TESTS.sh

      # The per-PR functional tests (plink2_functional_tests.yml) run reduced
      # versions of the slowest tests in 2.0/Tests (fewer sample counts,
      # oracle checks on a subset, etc.).  PLINK2_FULL_TESTS=1 makes the whole
      # suite run at full size here.  This also runs if the GLM tests fail.
      # Many of the tests compare against PLINK 1.9, so build that first.
      - name: Build PLINK 1.9
        id: build19
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: 1.9
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            make -j"$(getconf _NPROCESSORS_ONLN)" ZLIB=-lz BLASFLAGS="-llapack -lopenblas"
          else
            make -j"$(getconf _NPROCESSORS_ONLN)" ZLIB=-lz
          fi
          echo "$GITHUB_WORKSPACE/1.9" >> "$GITHUB_PATH"

      - name: Run 2.0/Tests at full size
        if: ${{ !cancelled() && steps.build19.outcome == 'success' }}
        working-directory: 2.0/Tests
        env:
          PLINK2_FULL_TESTS: 1
        run: ./run_tests.sh "$GITHUB_WORKSPACE/2.0/build_dynamic"

      - name: Upload 2.0/Tests logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plink2-full-test-logs-${{ matrix.os }}
          path: 2.0/Tests/**/*.log
          if-no-files-found: ignore

      - name: Cleanup
        run: |
          chmod +x 2.0/build_dynamic/CI-SCRIPTS/CLEANUP.sh
          2.0/build_dynamic/CI-SCRIPTS/CLEANUP.sh
